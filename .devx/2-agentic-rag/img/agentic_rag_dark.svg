<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 280" width="810" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs><marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8a8a8a"/></marker></defs>
  <!-- clusters -->
  <rect x="140" y="44" width="390" height="100" rx="10" fill="#76b900" fill-opacity="0.05" stroke="#76b900" stroke-width="1.5"/>
  <text x="154" y="62" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1">ReAct Agent</text>
  <rect x="648" y="50" width="156" height="216" rx="10" fill="#76b900" fill-opacity="0.05" stroke="#76b900" stroke-width="1.5"/>
  <text x="662" y="68" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1">Retrieval Chain</text>
  <!-- react edges -->
  <line x1="96" y1="98" x2="150" y2="98" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="234" y1="98" x2="248" y2="98" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="366" y1="98" x2="430" y2="98" stroke="#6e6e6e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <path d="M462,78 C 402,56 252,56 196,76" fill="none" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="308" y1="124" x2="308" y2="152" stroke="#6e6e6e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <!-- tool call (thick, long horizontal gap) -->
  <line x1="512" y1="98" x2="667" y2="104" stroke="#6e6e6e" stroke-width="3" marker-end="url(#ah)"/>
  <!-- retrieval edges (vertical) -->
  <line x1="726" y1="126" x2="726" y2="140" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="726" y1="194" x2="726" y2="206" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- edge labels -->
  <rect x="379" y="81" width="30" height="17" rx="4" fill="#161616"/>
  <text x="394" y="90" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">yes</text>
  <rect x="294" y="129" width="28" height="17" rx="4" fill="#161616"/>
  <text x="308" y="138" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">no</text>
  <rect x="562" y="79" width="56" height="17" rx="4" fill="#161616"/>
  <text x="590" y="88" fill="#8fcb2b" font-size="11" text-anchor="middle" dominant-baseline="central">tool call</text>
  <!-- react nodes -->
  <rect x="10" y="76" width="86" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="53" y="98" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">Prompt</text>
  <rect x="152" y="76" width="82" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="193" y="98" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">LLM</text>
  <polygon points="308,72 366,98 308,124 250,98" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="308" y="98" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">has tool calls?</text>
  <rect x="432" y="78" width="80" height="40" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="472" y="98" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">tools</text>
  <rect x="254" y="154" width="108" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="308" y="176" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">Response</text>
  <!-- retrieval nodes (stacked vertically) -->
  <rect x="671" y="82" width="110" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="13" fill="#f2f2f2"><tspan x="726" y="100">Embedding</tspan><tspan x="726" y="114">Model</tspan></text>
  <rect x="666" y="142" width="120" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M674,154 a52,5 0 0 0 104,0" fill="none" stroke="#3a3a3a" stroke-width="1.3"/>
  <text text-anchor="middle" font-size="12" fill="#f2f2f2"><tspan x="726" y="170">Vector DB</tspan><tspan x="726" y="184">Search</tspan></text>
  <rect x="671" y="208" width="110" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="13" fill="#f2f2f2"><tspan x="726" y="226">Reranking</tspan><tspan x="726" y="240">Model</tspan></text>
</svg>
