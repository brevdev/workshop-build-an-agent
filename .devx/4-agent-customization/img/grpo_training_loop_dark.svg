<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 196" width="752" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark SVG; mirrors img/grpo_training_loop.mmd. Colors from index.html mermaid themeVariables. -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#76b900"/>
    </marker>
  </defs>
  <rect x="10" y="8" width="732" height="116" rx="10" fill="#76b900" fill-opacity="0.05" stroke="#76b900" stroke-width="1.5"/>
  <text x="24" y="28" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1">GRPO Training Loop</text>
  <line x1="158" y1="64" x2="190" y2="64" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="358" y1="64" x2="390" y2="64" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="540" y1="64" x2="572" y2="64" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- repeat loop (thick green) -->
  <path d="M656,90 V158 H94 V90" fill="none" stroke="#76b900" stroke-width="2.4" marker-end="url(#ahg)"/>
  <rect x="300" y="148" width="172" height="20" rx="4" fill="#161616"/>
  <text x="386" y="158" fill="#76b900" font-size="11.5" text-anchor="middle" dominant-baseline="central">Repeat for 50+ steps</text>
  <rect x="28" y="38" width="130" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="93" y="64" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="93" dy="-3">Training</tspan><tspan x="93" dy="16">Prompt</tspan></text>
  <rect x="190" y="38" width="168" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="274" y="64" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="274" dy="-3">Model Generates</tspan><tspan x="274" dy="16">4+ Outputs</tspan></text>
  <rect x="390" y="38" width="150" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="465" y="64" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="465" dy="-3">Reward Server</tspan><tspan x="465" dy="16">Scores</tspan></text>
  <rect x="572" y="38" width="168" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="656" y="64" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="656" dy="-3">GRPO Reinforces</tspan><tspan x="656" dy="16">Best Ones</tspan></text>
