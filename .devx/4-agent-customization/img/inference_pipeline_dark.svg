<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark SVG; mirrors img/inference_pipeline.mmd. Colors from index.html mermaid themeVariables. -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <!-- request -> planner -->
  <line x1="166" y1="98" x2="196" y2="98" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- planner -> HITL (general bash, top path) -->
  <path d="M 276 72 L 276 30 L 806 30 L 806 72" fill="none" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="541" y="22" fill="#a8a8a8" font-size="11.5" text-anchor="middle">general request: a bash command</text>
  <!-- planner -> tool -> HITL (LangGraph path) -->
  <line x1="356" y1="98" x2="386" y2="98" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="696" y1="98" x2="726" y2="98" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="541" y="186" fill="#a8a8a8" font-size="11.5" text-anchor="middle">LangGraph request: the langgraph_cli tool returns the command</text>
  <rect x="16" y="72" width="150" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="91" y="98" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="91" dy="-3">User Request</tspan><tspan x="91" dy="16">(natural language)</tspan></text>
  <rect x="196" y="72" width="160" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="276" y="98" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="276" dy="-3">Hosted Planner</tspan><tspan x="276" dy="16">(bash agent)</tspan></text>
  <rect x="386" y="58" width="310" height="104" rx="8" fill="none" stroke="#76b900" stroke-width="1.8"/>
  <text x="541" y="76" fill="#76b900" font-size="11.5" text-anchor="middle">langgraph_cli tool</text>
  <rect x="398" y="86" width="136" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="466" y="112" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="466" dy="-3">Trained Model</tspan><tspan x="466" dy="16">(HuggingFace)</tspan></text>
  <line x1="534" y1="112" x2="556" y2="112" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="556" y="86" width="128" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="620" y="112" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="620" dy="-3">JSON → CLI</tspan><tspan x="620" dy="16">command</tspan></text>
  <rect x="726" y="72" width="160" height="52" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="806" y="98" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="806" dy="-3">HITL Confirm</tspan><tspan x="806" dy="16">&amp; Execute</tspan></text>
</svg>
