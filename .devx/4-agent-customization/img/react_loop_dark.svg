  <rect x="150" y="40" width="96" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="198" y="62" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="198" dy="-3">LLM</tspan><tspan x="198" dy="15">Reasons</tspan></text>
  <rect x="278" y="40" width="102" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
