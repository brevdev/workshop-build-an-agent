  <rect x="548" y="40" width="92" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="594" y="65" fill="#f2f2f2" font-size="12.5" text-anchor="middle">Execute</text>
  <rect x="262" y="130" width="108" height="44" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="316" y="152" fill="#f2f2f2" font-size="12.5" text-anchor="middle"><tspan x="316" dy="-3">Observe</tspan><tspan x="316" dy="15">Output</tspan></text>
