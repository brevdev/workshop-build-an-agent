<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark SVG; mirrors img/react_loop.mmd. Colors from index.html mermaid themeVariables. -->
