<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="600" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark "agent IN sandbox" diagram for the DevX dark theme.
       Mirrors img/agent_in_sandbox.mmd; colors match index.html mermaid themeVariables. -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- outer cluster: Sandbox -->
  <rect x="20" y="20" width="620" height="244" rx="10" fill="#76b900" fill-opacity="0.04" stroke="#76b900" stroke-width="1.5"/>
  <text x="330" y="42" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Sandbox</text>

  <!-- inner cluster: Agent Process -->
  <rect x="45" y="60" width="570" height="174" rx="8" fill="#76b900" fill-opacity="0.06" stroke="#76b900" stroke-width="1.5"/>
  <text x="330" y="82" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Agent Process</text>

  <!-- edge: sandbox <-> external -->
  <line x1="330" y1="264" x2="330" y2="322" stroke="#6e6e6e" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="296" y="284" width="68" height="18" rx="4" fill="#0c0c0c"/>
  <text x="330" y="294" fill="#8fcb2b" font-size="12" text-anchor="middle" dominant-baseline="central">HTTP/WS</text>

  <!-- inner nodes -->
  <rect x="85" y="110" width="120" height="72" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="145" y="146" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">Tools</text>

  <rect x="270" y="110" width="130" height="72" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="335" y="146" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">File System</text>

  <rect x="455" y="110" width="120" height="72" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="515" y="146" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">API Keys</text>

  <!-- external services -->
  <rect x="225" y="324" width="210" height="56" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="330" y="352" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">External Services</text>
</svg>
