<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="900" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark credential-injection sequence diagram for the DevX dark theme.
       Mirrors the why_nemoclaw.md sequenceDiagram; colors match index.html mermaid themeVariables.
       Solid arrows = requests; dashed = responses. -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="113" y1="60" x2="113" y2="440" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="345" y1="60" x2="345" y2="440" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="595" y1="60" x2="595" y2="440" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="825" y1="60" x2="825" y2="440" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- participant boxes -->
  <rect x="48" y="18" width="130" height="42" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="113" y="39" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">Agent (sandbox)</text>
  <rect x="270" y="18" width="150" height="42" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="345" y="39" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">OpenShell Proxy</text>
  <rect x="525" y="18" width="140" height="42" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="595" y="39" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">Gateway (host)</text>
  <rect x="755" y="18" width="140" height="42" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="825" y="39" fill="#f2f2f2" font-size="12" text-anchor="middle" dominant-baseline="central">Inference API</text>

  <!-- m1 Agent -> Proxy -->
  <text x="229" y="90" fill="#c6c6c6" font-size="10" text-anchor="middle">POST inference.local</text>
  <line x1="113" y1="100" x2="345" y2="100" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- m2 Proxy -> GW -->
  <text x="470" y="140" fill="#c6c6c6" font-size="10" text-anchor="middle">forward (strip creds)</text>
  <line x1="345" y1="150" x2="595" y2="150" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- m3 GW self: inject key -->
  <path d="M595,196 h62 v18 h-60" fill="none" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="664" y="205" fill="#c6c6c6" font-size="10" text-anchor="start" dominant-baseline="central">inject real key</text>
  <!-- m4 GW -> API -->
  <text x="710" y="252" fill="#c6c6c6" font-size="10" text-anchor="middle">POST api.nvidia.com</text>
  <line x1="595" y1="262" x2="825" y2="262" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- m5 API -->> GW -->
  <text x="710" y="302" fill="#c6c6c6" font-size="10" text-anchor="middle">response</text>
  <line x1="825" y1="312" x2="595" y2="312" stroke="#6e6e6e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <!-- m6 GW -->> Proxy -->
  <text x="470" y="352" fill="#c6c6c6" font-size="10" text-anchor="middle">forward response</text>
  <line x1="595" y1="362" x2="345" y2="362" stroke="#6e6e6e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <!-- m7 Proxy -->> Agent -->
  <text x="229" y="402" fill="#c6c6c6" font-size="10" text-anchor="middle">response (no keys)</text>
  <line x1="345" y1="412" x2="113" y2="412" stroke="#6e6e6e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
