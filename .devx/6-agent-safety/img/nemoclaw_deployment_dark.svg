<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="740" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark NemoClaw deployment diagram for the DevX dark theme.
       Mirrors the setup_nemoclaw.md mermaid; colors match index.html mermaid themeVariables. -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- clusters -->
  <rect x="30" y="24" width="700" height="130" rx="10" fill="#76b900" fill-opacity="0.05" stroke="#76b900" stroke-width="1.5"/>
  <text x="380" y="44" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Host Machine</text>
  <rect x="30" y="224" width="700" height="150" rx="10" fill="#76b900" fill-opacity="0.05" stroke="#76b900" stroke-width="1.5"/>
  <text x="380" y="244" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">NemoClaw Sandbox</text>

  <!-- edges -->
  <line x1="215" y1="96" x2="268" y2="96" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="218" y="78" width="62" height="16" rx="3" fill="#0c0c0c"/>
  <text x="249" y="86" fill="#c6c6c6" font-size="10" text-anchor="middle" dominant-baseline="central">manages</text>
  <line x1="545" y1="96" x2="457" y2="96" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="458" y="78" width="86" height="16" rx="3" fill="#0c0c0c"/>
  <text x="501" y="86" fill="#c6c6c6" font-size="10" text-anchor="middle" dominant-baseline="central">injects creds</text>
  <line x1="362" y1="126" x2="377" y2="268" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="320" y="189" width="118" height="16" rx="3" fill="#0c0c0c"/>
  <text x="379" y="197" fill="#c6c6c6" font-size="10" text-anchor="middle" dominant-baseline="central">enforces policies</text>
  <line x1="215" y1="299" x2="288" y2="299" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="216" y="281" width="72" height="16" rx="3" fill="#0c0c0c"/>
  <text x="252" y="289" fill="#c6c6c6" font-size="10" text-anchor="middle" dominant-baseline="central">all traffic</text>

  <!-- host nodes -->
  <rect x="55" y="66" width="160" height="60" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="135" y="96" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">nemoclaw CLI</text>
  <rect x="270" y="66" width="185" height="60" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="362" y="96" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">OpenShell Gateway</text>
  <rect x="545" y="66" width="165" height="60" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="627" y="88" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">Credential</text>
  <text x="627" y="106" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">Providers</text>

  <!-- sandbox nodes -->
  <rect x="55" y="270" width="160" height="58" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="135" y="299" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">OpenClaw Agent</text>
  <rect x="288" y="270" width="174" height="58" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="375" y="299" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">Network Proxy</text>
  <rect x="545" y="270" width="165" height="58" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="627" y="291" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">Landlock</text>
  <text x="627" y="309" fill="#f2f2f2" font-size="13" text-anchor="middle" dominant-baseline="central">Filesystem</text>
</svg>
