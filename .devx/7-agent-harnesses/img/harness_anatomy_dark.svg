<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 648" width="640" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Hand-authored dark "harness anatomy" diagram for the DevX dark theme.
       Mirrors img/harness_anatomy.mmd; colors match index.html mermaid themeVariables. -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- User (double circle) -->
  <circle cx="360" cy="46" r="32" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="360" cy="46" r="27" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="360" y="46" fill="#f2f2f2" font-size="12.5" text-anchor="middle" dominant-baseline="central">&#128100; User</text>

  <!-- User <-> Harness (bidirectional) -->
  <line x1="360" y1="82" x2="360" y2="126" stroke="#6e6e6e" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- cluster: THE HARNESS -->
  <rect x="28" y="130" width="664" height="494" rx="10" fill="#76b900" fill-opacity="0.04" stroke="#76b900" stroke-width="1.5"/>
  <text x="360" y="153" fill="#76b900" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">&#128295; THE HARNESS</text>

  <!-- feeder nodes -->
  <rect x="52" y="178" width="196" height="74" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="150" y="202" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">&#128193; Memory</text>
  <text x="150" y="230" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">persistence across sessions</text>

  <rect x="262" y="178" width="196" height="74" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="360" y="202" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">&#128218; Skills</text>
  <text x="360" y="230" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">on-demand knowledge</text>

  <rect x="472" y="178" width="196" height="74" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="570" y="198" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">&#128736;&#65039; Tool Calling</text>
  <text x="570" y="222" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">execution, sandboxing,</text>
  <text x="570" y="240" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">permissions</text>

  <!-- feeder -> loop edges -->
  <line x1="150" y1="252" x2="310" y2="297" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="360" y1="252" x2="360" y2="297" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="570" y1="252" x2="410" y2="297" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- cluster: The Agentic Loop -->
  <rect x="236" y="300" width="248" height="184" rx="8" fill="#76b900" fill-opacity="0.06" stroke="#76b900" stroke-width="1.5"/>
  <text x="360" y="322" fill="#76b900" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">The Agentic Loop</text>

  <!-- LLM (double circle) -->
  <circle cx="360" cy="404" r="70" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="360" cy="404" r="63" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="360" y="384" fill="#f2f2f2" font-size="13.5" text-anchor="middle" dominant-baseline="central">&#129504; LLM</text>
  <text x="360" y="404" fill="#a3a3a3" font-size="10" text-anchor="middle" dominant-baseline="central">stateless</text>
  <text x="360" y="424" fill="#a3a3a3" font-size="9.5" text-anchor="middle" dominant-baseline="central">tokens in &#8594; tokens out</text>

  <!-- loop -> self-evolution -->
  <line x1="280" y1="484" x2="217" y2="528" stroke="#6e6e6e" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- token efficiency -. budgets .- loop (dotted, no arrowheads) -->
  <line x1="510" y1="530" x2="484" y2="484" stroke="#6e6e6e" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="467" y="499" width="60" height="16" rx="4" fill="#0c0c0c"/>
  <text x="497" y="507" fill="#8fcb2b" font-size="10.5" text-anchor="middle" dominant-baseline="central">budgets</text>

  <!-- bottom nodes -->
  <rect x="96" y="530" width="210" height="72" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="201" y="552" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">&#127793; Self-Evolution</text>
  <text x="201" y="574" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">agent improves its own</text>
  <text x="201" y="590" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">scaffolding</text>

  <rect x="414" y="530" width="218" height="72" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="523" y="556" fill="#f2f2f2" font-size="14" text-anchor="middle" dominant-baseline="central">&#9889; Token Efficiency</text>
  <text x="523" y="580" fill="#a3a3a3" font-size="10.5" font-style="italic" text-anchor="middle" dominant-baseline="central">context budget management</text>
</svg>
