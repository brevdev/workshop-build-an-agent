# ============================================================================
# DELIBERATELY WEAK OpenShell Policy — For Exercise 1 Validation Testing
# ============================================================================
# This policy contains TWO intentional security violations.
# The supplied validator catches both before running probes.
#
# Format follows the OpenShell Policy Schema Reference:
#   https://docs.nvidia.com/openshell/latest/reference/policy-schema
# ============================================================================

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
  read_write:
    - /                          # VIOLATION 2: Write access to entire filesystem
    - /tmp                       #   The policy permits writes across the filesystem;
                                 #   normal filesystem permissions still apply.

landlock:
  compatibility: best_effort

process:
  run_as_user: "root"            # VIOLATION 1: Agent runs as root
  run_as_group: "root"           #   Agents must NEVER run as root — a compromised
                                 #   agent with root access owns the entire system.

# No network allow rules: OpenShell denies outbound destinations by default.
network_policies: {}
