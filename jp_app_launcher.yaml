# Coding-assistant tiles. `type: terminal` opens a JupyterLab terminal and sends
# `source` as the initial command (the frontend appends a carriage return, so it
# auto-runs). Both CLIs are installed globally by postBuild.bash.
#
# `source` runs the CLIs through .devx/bin/start-assistant.sh rather than invoking
# them bare. Landing on an unexplained TUI told the learner nothing about the tutor
# skills this repo ships; the wrapper prints an orientation card while they
# authenticate, and on the first authenticated launch seeds an opening prompt so
# the tutor introduces itself inside the TUI (where a pre-exec banner would be
# wiped by a full-screen TUI). It execs the CLI, so signals and resize behave
# exactly as before. See the header of that script for the full rationale.
#
# cwd MUST stay /project: that is what makes this repo's tutor skills load, so a
# learner can type /workshop or /module-1..8 straight after authenticating.
# Claude Code reads .claude/skills/, Codex reads .agents/skills/.
#
# Deliberately no `args: {reuse: true}` — on a second click reuse reconnects to the
# existing session but STILL replays the initial command, which would type "claude"
# into the already-running TUI and submit it as a prompt. Without reuse each click
# gets a clean session (ClaudeCode1, ClaudeCode2, ...); earlier ones stay reachable
# from the Running Terminals sidebar.
#
# NOTE: this catalog is named to sort AFTER "NVIDIA DevX Learning Path". JupyterLab
# orders launcher sections alphabetically when no categoryRank is set (which
# jupyter-app-launcher never sets), so renaming this to something starting before
# "N" would push these tiles above the learning path.

- title: "Claude Code"
  description: "Anthropic's agentic CLI, preloaded with this workshop's tutor skills. Authenticate on first run, then use /workshop or /module-1..8 — or just ask."
  source: "bash /project/.devx/bin/start-assistant.sh claude"
  cwd: /project
  type: terminal
  args: {}
  icon: /project/.devx/_static/img/claude-icon.svg
  catalog: Workshop Assistants

- title: "Codex CLI"
  description: "OpenAI's agentic CLI, preloaded with this workshop's tutor skills. Authenticate on first run, then use $workshop or $module-1..8 — or just ask."
  source: "bash /project/.devx/bin/start-assistant.sh codex"
  cwd: /project
  type: terminal
  args: {}
  icon: /project/.devx/_static/img/openai-icon.svg
  catalog: Workshop Assistants